name: Verify FFXIV offsets

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Comma-separated regions to verify
        required: true
        default: Global,China,TC
        type: string
  push:
    paths:
      - Memory/Offsets.cs
      - Memory/Attributes/OffsetAttribute.cs
  pull_request:
    paths:
      - Memory/Offsets.cs
      - Memory/Attributes/OffsetAttribute.cs

env:
  VERIFIER_ID: 1472883b7684ad63faad4f1c9b90d7e54d125e16
  VERIFIER_URL: https://llamalibraryoffsetverifier.llamaserver.com/LlamaLibraryOffsetVerifier-linux-x64-1472883b7684ad63faad4f1c9b90d7e54d125e16.tar.gz?release=v1.1.0
  VERIFIER_SHA256: 7008b6b48a9142d64625233d1fbe205c643bad01f823ec6622fa6ccf8f9a3183
  ARTIFACT_SERVER: https://api.llamashepherd.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download verifier
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/llama-offset-verifier"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$VERIFIER_URL" \
            --output "$RUNNER_TEMP/llama-offset-verifier.tar.gz"
          printf '%s  %s\n' \
            "$VERIFIER_SHA256" \
            "$RUNNER_TEMP/llama-offset-verifier.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/llama-offset-verifier.tar.gz" \
            -C "$RUNNER_TEMP/llama-offset-verifier"
          chmod +x "$RUNNER_TEMP/llama-offset-verifier/LlamaLibraryOffsetVerifier"

      - name: Resolve regional targets
        id: targets
        shell: bash
        env:
          REGIONS: ${{ inputs.regions || 'Global,China,TC' }}
        run: |
          set -euo pipefail
          targets_path="$RUNNER_TEMP/ffxiv-targets.json"
          "$RUNNER_TEMP/llama-offset-verifier/LlamaLibraryOffsetVerifier" targets \
            --artifact-server "$ARTIFACT_SERVER" \
            --region "$REGIONS" \
            --json "$targets_path"
          target_digest="$(sha256sum "$targets_path" | cut -d ' ' -f 1)"
          echo "path=$targets_path" >> "$GITHUB_OUTPUT"
          echo "digest=$target_digest" >> "$GITHUB_OUTPUT"

      - name: Restore client cache
        id: client-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ffxiv-clients
          key: ffxiv-offset-clients-v1-${{ env.VERIFIER_ID }}-${{ steps.targets.outputs.digest }}

      - name: Verify offsets
        id: verify
        shell: bash
        env:
          REGIONS: ${{ inputs.regions || 'Global,China,TC' }}
        run: |
          "$RUNNER_TEMP/llama-offset-verifier/LlamaLibraryOffsetVerifier" verify \
            --source-root "$GITHUB_WORKSPACE" \
            --client-root "$RUNNER_TEMP/ffxiv-clients" \
            --artifact-server "$ARTIFACT_SERVER" \
            --region "$REGIONS" \
            --targets "${{ steps.targets.outputs.path }}" \
            --json "$GITHUB_WORKSPACE/offset-verification.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Check prepared client cache
        id: client-cache-ready
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ffxiv-clients/client-cache-manifest.json" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save client cache
        if: always() && steps.client-cache.outputs.cache-hit != 'true' && steps.client-cache-ready.outputs.ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ffxiv-clients
          key: ffxiv-offset-clients-v1-${{ env.VERIFIER_ID }}-${{ steps.targets.outputs.digest }}

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offset-verification
          path: offset-verification.json
          if-no-files-found: warn
