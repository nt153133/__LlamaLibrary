name: Release.yml
on:
    workflow_dispatch:
    release:
        types: [published]

jobs:
    build:
        permissions:
          id-token: write  # enable GitHub OIDC token issuance for this job
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Setup dotnet
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.0.x
                      10.0.x
            - name: Install dependencies
              run: dotnet restore
            - name: Get Current Date Time
              id: t1
              uses: Kaven-Universe/github-action-current-date-time@v1
              with:
                  format: "YYYY_MM_DD HH_mm_ss_SSS"
            - name: Calculate Version
              run: |
                  let "MINOR = ${{ steps.t1.outputs.month }} * 100 + ${{ steps.t1.outputs.day }}"
                  let "REVISION = ${{ steps.t1.outputs.seconds }}"
                  let "BUILD = ${{ steps.t1.outputs.hours }} * 100 + ${{ steps.t1.outputs.minutes }}"
                  let "MAJOR = ${{ steps.t1.outputs.year }} - 2000"
                  echo "$MAJOR.$MINOR.$BUILD.$REVISION"
                  echo "VERSION=$MAJOR.$MINOR.$BUILD.$REVISION" >> $GITHUB_ENV
            - name: Create Nuget Package
              run: dotnet pack -c Release -p:Version=$VERSION --output nupkgs
            # Get a short-lived NuGet API key
            - name: NuGet login
              uses: NuGet/login@v1
              id: login
              with:
                user: nt153133 # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

            - name: Push nuget
              run: dotnet nuget push nupkgs/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
